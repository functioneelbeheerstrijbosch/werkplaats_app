name: Diagnose backend (read-only)

# Alleen handmatig te starten — draait nooit automatisch, triggert geen
# deploy en herstart de service niet. Puur lezen: service-info + recente
# Event Viewer-regels die met de reparaties-route te maken hebben.
# Tijdelijk bestand — wordt na gebruik weer verwijderd.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted

    steps:
      - name: Service info (read-only)
        shell: powershell
        run: |
          Get-CimInstance Win32_Service -Filter "Name='StrijboschAPI'" |
            Select-Object Name, State, PathName, StartName |
            Format-List

      - name: Recente foutregels reparaties-route (read-only)
        shell: powershell
        run: |
          Get-WinEvent -LogName Application -MaxEvents 1000 -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Message -match 'reparaties' -or
              $_.ProviderName -match 'StrijboschAPI' -or
              $_.ProviderName -match 'node'
            } |
            Select-Object -First 30 TimeCreated, ProviderName, LevelDisplayName, Message |
            Format-List

      - name: Tail backend stderr.log (read-only)
        shell: powershell
        run: |
          $path = "${{ secrets.IIS_PATH }}\backend\logs\stderr.log"
          if (Test-Path $path) {
            Get-Content $path -Tail 100
          } else {
            Write-Output "Bestand bestaat nog niet: $path"
          }

      - name: Tail backend stdout.log (read-only)
        shell: powershell
        run: |
          $path = "${{ secrets.IIS_PATH }}\backend\logs\stdout.log"
          if (Test-Path $path) {
            Get-Content $path -Tail 100
          } else {
            Write-Output "Bestand bestaat nog niet: $path"
          }
