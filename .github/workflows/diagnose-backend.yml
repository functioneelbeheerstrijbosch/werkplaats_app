name: Diagnose backend (read-only)

# Alleen handmatig te starten — draait nooit automatisch, triggert geen
# deploy en herstart de service niet. Draait op de server zelf, met de
# echte productie-.env, maar doet alleen SELECT's en één externe GET —
# geen enkele schrijfactie. Tijdelijk bestand, wordt na gebruik verwijderd.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted

    steps:
      - name: Dry-run opruimstap (read-only, geen wijzigingen)
        shell: powershell
        run: |
          $script = @'
          require("dotenv").config();
          const db = require("./db");

          (async () => {
            try {
              const apiUrl = process.env.STRIJBOSCH_API_URL;
              const apiKey = process.env.STRIJBOSCH_API_KEY;
              console.log("API_URL (host only):", new URL(apiUrl).host);

              const res = await fetch(`${apiUrl}?apikey=${apiKey}`, {
                headers: { "User-Agent": "Strijbosch-Werkplaats/1.0", "Accept": "application/json" },
              });
              console.log("HTTP status:", res.status);
              if (!res.ok) { console.log("Body:", (await res.text()).slice(0, 300)); process.exit(1); }
              const apiRijen = await res.json();
              console.log("API-rijen ontvangen:", apiRijen.length);

              const gezien = new Set();
              for (const r of apiRijen) {
                const genorm = Object.fromEntries(Object.entries(r).map(([k, v]) => [k.toLowerCase(), v]));
                if (!genorm.opdrachtnr) continue;
                gezien.add(`${genorm.opdrachtnr}|${genorm.regelnummer ?? 1}`);
              }
              console.log("Unieke (opdrachtnr, regelnummer) in de sync:", gezien.size);

              const [lokaal] = await db.query(
                "SELECT id, opdrachtnr, regelnummer, soort, in_behandeling_op, status FROM reparaties"
              );
              console.log("Totaal in reparaties:", lokaal.length);

              const kandidaten = lokaal.filter(r => r.soort === null && r.in_behandeling_op === null);
              const teVerwijderen = kandidaten.filter(r => !gezien.has(`${r.opdrachtnr}|${r.regelnummer ?? 1}`));
              console.log("Kandidaten (soort IS NULL, niet in behandeling):", kandidaten.length);
              console.log("ZOU verwijderd worden (dry-run):", teVerwijderen.length);
              teVerwijderen.slice(0, 50).forEach(r =>
                console.log(" -", r.opdrachtnr, "/", r.regelnummer, "| status:", r.status, "(id", r.id + ")")
              );
              if (teVerwijderen.length > 50) console.log("  ... en nog", teVerwijderen.length - 50, "meer");
            } catch (e) {
              console.log("ERROR:", e.message);
            }
            process.exit(0);
          })();
          '@

          $backendPad = "${{ secrets.IIS_PATH }}\backend"
          $tijdelijkBestand = Join-Path $backendPad "_diag_dryrun_ci.js"
          Set-Content -Path $tijdelijkBestand -Value $script -Encoding utf8

          Push-Location $backendPad
          try {
            node "_diag_dryrun_ci.js"
          } finally {
            Pop-Location
            Remove-Item $tijdelijkBestand -Force -ErrorAction SilentlyContinue
          }
