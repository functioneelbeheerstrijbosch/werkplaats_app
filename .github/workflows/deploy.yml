name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy frontend
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\frontend"
          $destination = "${{ secrets.IIS_PATH }}"

          robocopy $source $destination /E /XD ".git" ".github"

          if ($LASTEXITCODE -gt 7) {
              exit $LASTEXITCODE
          }

          exit 0

      - name: Deploy backend
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\backend"
          $destination = "${{ secrets.IIS_PATH }}\backend"

          robocopy $source $destination /E /XD "node_modules"

          if ($LASTEXITCODE -gt 7) {
              exit $LASTEXITCODE
          }

          exit 0

      - name: Install backend dependencies
        shell: powershell
        run: |
          cd "${{ secrets.IIS_PATH }}\backend"

          npm i

      - name: Configure backend logging
        shell: powershell
        run: |
          # Zorgt dat console.log/console.error van de backend daadwerkelijk
          # ergens terechtkomen — NSSM doet dat niet uit zichzelf. Idempotent:
          # veilig om bij elke deploy opnieuw te zetten. Rotatie voorkomt dat
          # de bestanden onbeperkt groeien (10MB per bestand).
          $logDir = "${{ secrets.IIS_PATH }}\backend\logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $nssm = "C:\Program Files (x86)\nssm-2.24\win64\nssm.exe"
          & $nssm set StrijboschAPI AppStdout "$logDir\stdout.log"
          & $nssm set StrijboschAPI AppStderr "$logDir\stderr.log"
          & $nssm set StrijboschAPI AppRotateFiles 1
          & $nssm set StrijboschAPI AppRotateOnline 1
          & $nssm set StrijboschAPI AppRotateBytes 10485760

      - name: Restart backend
        shell: powershell
        run: |
          Restart-Service "StrijboschAPI"

          $service = Get-Service "StrijboschAPI"

          if ($service.Status -ne "Running") {
              throw "StrijboschAPI failed to start."
          }